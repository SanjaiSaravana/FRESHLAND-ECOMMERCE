<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freshland | Signup</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <style>
        body {
            background: url('img/sigb.avif') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
        }

        .form-container {
            max-width: 500px;
            width: 100%;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .form-container h4 {
            color: #333;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #4caf50;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background-color: #88e78b;
        }

        .btn-link {
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <center>
            <h4 class="mb-4">Signup for Fresh-Land</h4>
        </center>
        <form>
            <div class="form-group">
                <label for="name">Name:</label>
                <input class="form-control" type="text" name="name" id="name" placeholder="Enter your name" required />
            </div>
            <div class="form-group">
                <label for="contact_number">Contact Number:</label>
                <input class="form-control" type="text" name="contact_number" id="contact_number" placeholder="Enter your number" required />
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input class="form-control" type="email" name="email" id="email" placeholder="Enter your email" required />
            </div>
            <div class="form-group">
                <label for="username">User Name:</label>
                <input class="form-control" type="text" name="username" id="username" placeholder="Enter your User name" required />
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input class="form-control" type="password" name="password" id="password" placeholder="Create a password" required />
            </div>
            <div class="form-group form-check">
                <input class="form-check-input" type="checkbox" id="ex" required />
                <label class="form-check-label" for="ex">
                    I agree with the data terms and policies.
                </label>
            </div>

            <!-- Signup Button as Link -->
            <a href="index.html" class="btn btn-primary btn-block">Sign Up</a>
        </form>
    </div>
</body>
</html>
